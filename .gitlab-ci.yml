# GAL release-chain entry (GitLab CI).
#
# This private GitLab repo is the source of truth. Pushing a `v*` tag here runs
# ONE job that:
#   1. publishes a curated, leak-scanned snapshot to the PUBLIC GitHub repo, then
#   2. pushes the same tag to GitHub, which triggers .github/workflows/release.yml
#      (build → sign → GitHub Release → Homebrew tap push → WinGet submit → smoke).
#
# The single manual action per release is `git push origin v<x.y.z>` to GitLab.
#
# Required CI/CD variables (Settings → CI/CD → Variables — masked + protected;
# only the NAME is referenced here, never the value):
#   GITHUB_PUSH_TOKEN — a GitHub token scoped to `contents:write` on ONLY the
#                       public golem-agents-legion repo (blast radius minimized).
#
# Fail-closed: the leak-scan (publish-public.sh) exits non-zero on any residual
# planning/state/secret, which fails the whole job before any force-push.

stages:
  - release

publish-public-release:
  stage: release
  image: alpine:3.20
  # Prerelease tags (v0.1.0-rc4) rehearse the SAME chain; the GitHub side skips
  # Homebrew/WinGet for '-' tags, so the rehearsal never touches those ecosystems.
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  variables:
    PUBLIC_REPO: "monkey1wizard/golem-agents-legion"
    PUBLIC_BRANCH: "main"
  before_script:
    - apk add --no-cache git bash grep findutils coreutils tar
  script:
    - set -euo pipefail
    # 1. Wire the 'github' remote that publish-public.sh requires (token-authed).
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://x-access-token:${GITHUB_PUSH_TOKEN}@github.com/${PUBLIC_REPO}.git"
    # 2. Re-run guard: a half-failed re-run produces a DIFFERENT snapshot SHA
    #    (the snapshot commit is timestamped), so never auto-force a tag. Abort if
    #    the tag already exists on the public repo and require manual deletion.
    - |
      if git ls-remote --tags github "refs/tags/${CI_COMMIT_TAG}" | grep -q "${CI_COMMIT_TAG}"; then
        echo "ABORT: tag ${CI_COMMIT_TAG} already exists on the public repo." >&2
        echo "Delete the remote tag manually and re-run — GAL never force-updates a published tag." >&2
        exit 1
      fi
    # 3. Fail-closed leak-scan (dry run). Non-zero → whole pipeline stops, no push.
    - bash packaging/publish-public.sh --remote github --branch "${PUBLIC_BRANCH}"
    # 4. Execute: force-push the curated snapshot to public main (re-scans first).
    - bash packaging/publish-public.sh --remote github --branch "${PUBLIC_BRANCH}" --execute
    # 5. Tag landing: publish-public.sh's snapshot temp dir is trap-cleaned and
    #    not reusable, and the snapshot commit is NOT present in the runner's own
    #    repo — so `git ls-remote` yields only the SHA string (not the object) and
    #    `git push <sha>:refs/tags/...` fails with "fatal: bad object". Fetch the
    #    just-pushed public HEAD into the local object store first, then tag it.
    - |
      git fetch github "${PUBLIC_BRANCH}"
      SHA="$(git rev-parse FETCH_HEAD)"
      if [ -z "$SHA" ]; then
        echo "ABORT: could not resolve public ${PUBLIC_BRANCH} HEAD after push." >&2
        exit 1
      fi
      git push github "${SHA}:refs/tags/${CI_COMMIT_TAG}"
      echo "Pushed ${CI_COMMIT_TAG} -> ${SHA} on the public repo; GitHub Actions release.yml takes over."
