name: Writing quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  writing-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          check-latest: false

      - name: Install lockfile dependencies
        run: npm ci --prefix tools/writing

      - name: Run writing tool fixtures
        run: |
          node --test tools/writing/tests/check.test.mjs
          node --test tools/writing/tests/prose.test.mjs
          node --test tools/writing/tests/terms.test.mjs tools/writing/tests/terminology.test.mjs

      - name: Check required corpus
        run: node tools/writing/check.mjs --required

      - name: Upload complete writing reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: writing-quality-reports
          path: .dev/pipeline/writing-quality/**/report.json
          include-hidden-files: true
          if-no-files-found: warn
