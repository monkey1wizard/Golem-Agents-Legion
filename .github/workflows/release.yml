# GAL Release Workflow
#
# Trigger: push of a version tag (v*).
# Produces: cross-platform gal binaries + fallback archives, checksums.txt,
#   artifact-manifest.json, and a cosign keyless signature over checksums.txt.
#
# Cosign trust setup (OQ-001, S-3):
#   - Signing uses sigstore/cosign keyless (GitHub Actions OIDC, no long-term key).
#   - The workflow identity is pinned to this repo via `repository` and
#     `repository_owner` claims so the Rekor entry can be verified offline.
#   - `id-token: write` is the minimum OIDC permission required; it is scoped
#     to the `sign` job only. The build matrix jobs have no OIDC access.
#   - Verification: `cosign verify-blob checksums.txt
#       --certificate-identity-regexp 'https://github.com/monkey1wizard/golem-agents-legion/.*'
#       --certificate-oidc-issuer https://token.actions.githubusercontent.com`
#
# Security review S-3 note: this workflow is the cosign CI trust surface that
# was deferred from the pre-P2 security audit. Review this file before the
# first package-manager publication per the security review gate.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# Restrict default permissions to read-only; elevate only where needed.
permissions:
  contents: write   # create GitHub Release and upload assets
  id-token: none    # elevated to 'write' in the sign job only

jobs:
  # ── Build matrix ─────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows
            arch: x64
            binary_ext: .exe
            archive_ext: .zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            platform: windows
            arch: arm64
            binary_ext: .exe
            archive_ext: .zip
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: darwin
            arch: x64
            binary_ext: ""
            archive_ext: .tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin
            arch: arm64
            binary_ext: ""
            archive_ext: .tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux
            arch: x64
            binary_ext: ""
            archive_ext: .tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux
            arch: arm64
            binary_ext: ""
            archive_ext: .tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (musl targets)
        if: contains(matrix.target, 'musl')
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary (native)
        if: "!contains(matrix.target, 'musl')"
        run: cargo build --release --target ${{ matrix.target }} -p cli

      - name: Build binary (cross/musl)
        if: contains(matrix.target, 'musl')
        run: cross build --release --target ${{ matrix.target }} -p cli

      - name: Prepare canonical asset name
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          BINARY_NAME="gal-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.binary_ext }}"
          ARCHIVE_NAME="gal-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.archive_ext }}"
          echo "BINARY_NAME=${BINARY_NAME}" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Copy and rename binary
        shell: bash
        run: |
          SRC="target/${{ matrix.target }}/release/gal${{ matrix.binary_ext }}"
          cp "${SRC}" "${BINARY_NAME}"

      - name: Create fallback archive (zip — Windows)
        if: matrix.archive_ext == '.zip'
        shell: pwsh
        run: |
          Compress-Archive -Path $env:BINARY_NAME, "LICENSE" -DestinationPath $env:ARCHIVE_NAME

      - name: Create fallback archive (tar.gz — Unix)
        if: matrix.archive_ext == '.tar.gz'
        shell: bash
        run: |
          tar -czf "${ARCHIVE_NAME}" "${BINARY_NAME}" LICENSE

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.BINARY_NAME }}
          if-no-files-found: error

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  # ── Assemble + sign ───────────────────────────────────────────────────────
  sign:
    name: Assemble, sign, and publish
    needs: build
    runs-on: ubuntu-latest
    # OIDC permission scoped to this job only (S-3 cosign trust surface).
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets/

      - name: Flatten asset directory
        shell: bash
        run: |
          find assets/ -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.tar.gz" -o ! -name "*.*" \) \
            -exec mv {} ./  \;

      - name: Install Rust toolchain (for gal release)
        uses: dtolnay/rust-toolchain@stable

      - name: Build gal release tool
        run: cargo build --release -p cli

      - name: Generate checksums.txt and artifact-manifest.json
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          # Collect all canonical assets into a single invocation.
          ASSET_ARGS=""
          for f in gal-${VERSION}-*; do
            ASSET_ARGS="${ASSET_ARGS} --asset ${f}"
          done
          ./target/release/gal release \
            --version "${VERSION}" \
            --output-dir release-out \
            ${ASSET_ARGS}
          cp release-out/checksums.txt ./checksums.txt
          cp release-out/artifact-manifest.json ./artifact-manifest.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums.txt (cosign keyless — GitHub Actions OIDC)
        # Produces checksums.txt.sig + checksums.txt.pem (certificate) in Rekor.
        # Verification command (offline):
        #   cosign verify-blob checksums.txt \
        #     --signature checksums.txt.sig \
        #     --certificate checksums.txt.pem \
        #     --certificate-identity-regexp 'https://github.com/monkey1wizard/golem-agents-legion/.*' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
        run: |
          cosign sign-blob checksums.txt \
            --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GAL ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            gal-*
            checksums.txt
            checksums.txt.sig
            checksums.txt.pem
            artifact-manifest.json
