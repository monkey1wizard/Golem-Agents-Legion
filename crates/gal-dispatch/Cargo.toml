[package]
name = "gal-dispatch"
version = "0.1.0"
edition = "2021"
description = "GAL headless dispatch bin — routing, stage→role, spawn, write-back verification"
license = "MIT"
repository = "https://github.com/monkey1wizard/golem-agents-legion"

[[bin]]
name = "gal-dispatch"
path = "src/main.rs"

[lib]
name = "gal_dispatch"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.0"
