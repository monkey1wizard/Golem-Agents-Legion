[package]
name = "gal-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "gal_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
regex = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.0"
