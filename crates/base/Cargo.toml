[package]
name = "base"
version = "0.1.0"
edition = "2021"
description = "GAL foundation crate — config/mode/paths/install-state + shared data-model types. Depends on no other GAL crate."
license = "MIT"
repository = "https://github.com/monkey1wizard/golem-agents-legion"

[lib]
name = "base"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
thiserror = "2.0"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.0"
