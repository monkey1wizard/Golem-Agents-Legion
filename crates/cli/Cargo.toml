[package]
name = "gal-cli"
version = "0.1.2"
edition = "2021"
description = "GAL — Golem Agents Legion bootstrap CLI (binary: gal)"
license = "MIT"
repository = "https://github.com/monkey1wizard/golem-agents-legion"

[[bin]]
name = "gal"
path = "src/main.rs"

[dependencies]
projection = { path = "../projection" }
gal-foundation = { path = "../gal-foundation" }
gal-engine = { path = "../gal-engine" }
mcp = { path = "../mcp" }
serde_json = "1"
dirs = "5"
regex = "1.0"
thiserror = "2.0"
sha2 = "0.10"
unicode-normalization = "0.1"
dispatch = { path = "../dispatch" }
pipeline = { path = "../pipeline" }

[dev-dependencies]
tempfile = "3"
