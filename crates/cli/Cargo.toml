[package]
name = "cli"
version = "0.1.0"
edition = "2021"
description = "GAL — Golem Agents Legion bootstrap CLI (binary: gal)"
license = "MIT"
repository = "https://github.com/monkey1wizard/golem-agents-legion"

[[bin]]
name = "gal"
path = "src/main.rs"

[dependencies]
adapters = { path = "../adapters" }
base = { path = "../base" }
gal-engine = { path = "../gal-engine" }
mcp = { path = "../mcp" }
serde_json = "1"
setup = { version = "0.1.0", path = "../setup" }

[dev-dependencies]
tempfile = "3"
