[package]
name = "providers"
version = "0.1.0"
edition = "2021"
description = "GAL provider projection — Provider/MCP-config trait + claude/copilot/agy projection onto disk."
license = "MIT"
repository = "https://github.com/monkey1wizard/golem-agents-legion"

[lib]
name = "providers"
path = "src/lib.rs"

[dependencies]
base = { path = "../base" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
thiserror = "2.0"
regex = "1.0"

[dev-dependencies]
tempfile = "3.0"
